<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DeepSeek Harness</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><span class="mark">d</span><strong>DeepSeek Harness</strong><span class="badge">本地</span></div><div id="connection" role="status">正在连接本地服务…</div><div class="toolbar"><label class="sr" for="project">项目</label><select id="project"><option value="default">默认</option></select><button id="new" title="新建对话">＋ 新对话</button></div><label class="sr" for="session">对话历史</label><select id="session"><option value="">新对话</option></select></header><section id="setup" hidden><h2>连接你的本地工作空间</h2><p>需要已运行的 DeepSeek Harness 和配套本机组件。浏览器无法直接运行本地安装命令。</p><button id="repair">检测 / 修复连接</button><a href="install.html" target="_blank">开发版安装指引 ↗</a><pre id="versions"></pre></section><main id="messages" aria-live="polite"><div class="welcome"><div class="spark">✳</div><h1>从一个问题开始</h1><p>和本地项目聊一聊，<br>也可以把网页中的一段文字带进来。</p></div></main><div id="notice" role="status" hidden></div><button id="keep-duplicate" hidden>仍然添加此引用</button><footer><div class="compose"><div class="compose-top"><button id="capture">＋ 添加选中文字</button><span>最多 20 条 · 每条 20000 字</span></div><div id="contexts"></div><label class="sr" for="input">输入消息</label><textarea id="input" placeholder="向 DeepSeek 提问…" rows="3"></textarea><div class="compose-bottom"><span id="draft-label">引用仅在发送时提交</span><button id="check" hidden>检查发送状态</button><button id="stop" hidden>停止生成</button><button id="send" class="primary">发送 ↑</button></div></div><p class="footnote">由本地 DeepSeek Harness 处理 · 网页内容仅作参考</p></footer><script type="module" src="sidepanel.js"></script></body></html>
